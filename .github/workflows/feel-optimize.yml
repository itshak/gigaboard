name: FeelLab Configuration Optimization

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * *"

concurrency:
  group: feel-optimize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize:
    name: Controlled browser A/B sweep
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      FEELLAB_OPTIMIZE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install locked workspace
        run: bun install --frozen-lockfile
      - name: Build workspace
        run: bun run turbo build
      - name: Install Playwright Chromium
        working-directory: apps/benchmarks
        run: bun x playwright install --with-deps chromium
      - name: Real-board A/B sweep and accessible ranking
        working-directory: apps/benchmarks
        run: bun run feel:optimize
      - name: Assert actual comparison results exist
        run: |
          test -s apps/benchmarks/feel-results/results.json
          test -s apps/benchmarks/feel-results/optimization-results.json
          test -s apps/benchmarks/feel-results/optimization-report.md
          grep -q '"recommendedForFurtherHumanTesting"' apps/benchmarks/feel-results/optimization-results.json
      - name: Upload evidence including text, JSON and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feellab-optimization
          path: |
            apps/benchmarks/feel-results/
            apps/benchmarks/test-results/
          if-no-files-found: warn
          retention-days: 30
