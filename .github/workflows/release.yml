name: release

# Single workflow that handles both halves of the release lifecycle:
#
#  1. `release-please` job — watches `master` for conventional commits and
#     maintains an open "chore: release X.Y.Z" PR. Merging that PR runs
#     this workflow again: release-please now sees the bumped manifest,
#     pushes the git tags, and creates the GitHub Releases.
#
#  2. `publish` job — gated on `needs.release-please.outputs.releases_created`.
#     Only fires when step 1 actually cut a release this run.
#     Runs the full test gate and publishes the single `gigaboard` package
#     to npm with provenance via Trusted Publishing (OIDC).
#
# Why both live in one workflow: events emitted by `GITHUB_TOKEN`
# (including release-please's "release published" event) do NOT trigger
# other workflows in this repo — it's GitHub's loop-prevention rule. A
# separate `release: published` workflow never fires. Colocating the
# publish step sidesteps the limitation without needing a PAT.
#
# `paths_released` enumerates the single package directory needing
# `npm publish` on the automatic release path (always `["packages/react"]`
# for the consolidated `gigaboard` package). The manual retry path
# starts from the manifest and filters out versions that already exist
# on npm.

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or SHA) to publish — skips release-please job"
        required: false
        default: ""
        type: string

# `release-please` needs contents:write and pull-requests:write to open
# its PR and create the GitHub Release. `publish` narrows to its own
# minimum (id-token for OIDC, contents:read to check out).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.10"
  # Node 24 ships npm 11.x — required for the Trusted Publishing OIDC
  # handshake. On npm 10.x (Node 22 default) the provenance attestation
  # gets signed but the tarball PUT goes anonymous and 404s.
  NODE_VERSION: "24"

jobs:
  release-please:
    name: release-please (version PR + GitHub Release)
    runs-on: ubuntu-latest
    # Skip entirely on manual dispatch or tag push — user wants to publish a
    # specific ref or tag, not re-run release-please.
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    name: npm publish
    runs-on: ubuntu-latest
    # Gate: only publish if release-please just cut releases OR if a
    # tag was pushed OR if manually dispatched.
    needs: release-please
    if: >-
      ${{
        always() &&
        (
          (needs.release-please.result == 'success' &&
           needs.release-please.outputs.releases_created == 'true')
          ||
          github.event_name == 'workflow_dispatch'
          ||
          startsWith(github.ref, 'refs/tags/')
        )
      }}
    environment: npm-publish
    permissions:
      # id-token: write is what turns OIDC on — required for both
      # npm Trusted Publishing and npm provenance attestations.
      # contents: write is required by the trailing "Create GitHub
      # Release" step on tag pushes (checkout only needs read).
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Report runtime versions
        run: |
          bun --version
          node --version
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Standard gate: lint + typecheck + test before publishing.
      - name: Lint
        run: bun run turbo lint

      - name: Build
        run: bun run turbo build

      - name: Typecheck
        run: bun run turbo typecheck

      - name: Test
        run: bun run turbo test

      - name: Size budget
        run: bun run turbo size

      # Determine which package directories to publish.
      #
      # - release-please path: `paths_released` is a JSON array of
      #   package dirs (always `["packages/react"]` for the single
      #   `gigaboard` package).
      # - workflow_dispatch path: no release-please output — consider
      #   every package listed in the manifest, then skip versions that
      #   are already published. This keeps retries from failing on
      #   unchanged packages.
      - name: Resolve packages to publish
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            candidate_paths=$(jq -c 'keys' .github/.release-please-manifest.json)
          else
            candidate_paths='${{ needs.release-please.outputs.paths_released }}'
            # Defensive default — should always be non-empty when the
            # `if:` guard above lets us in, but guard anyway.
            if [[ -z "$candidate_paths" || "$candidate_paths" == "null" ]]; then
              candidate_paths=$(jq -c 'keys' .github/.release-please-manifest.json)
            fi
          fi

          paths='[]'
          while read -r dir; do
            [[ -z "$dir" ]] && continue
            name=$(jq -r '.name' "$dir/package.json")
            version=$(jq -r '.version' "$dir/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Already published: $name@$version"
              continue
            fi
            paths=$(jq -c --arg dir "$dir" '. + [$dir]' <<< "$paths")
          done < <(jq -r '.[]' <<< "$candidate_paths")

          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Will publish: $paths"

      - name: npm pack --dry-run (sanity log per package)
        env:
          PATHS: ${{ steps.resolve.outputs.paths }}
        run: |
          set -euo pipefail
          echo "$PATHS" | jq -r '.[]' | while read -r dir; do
            echo "::group::pack $dir"
            (cd "$dir" && npm pack --dry-run)
            echo "::endgroup::"
          done

      - name: publint + arethetypeswrong (per package)
        env:
          PATHS: ${{ steps.resolve.outputs.paths }}
        run: |
          set -euo pipefail
          echo "$PATHS" | jq -r '.[]' | while read -r dir; do
            echo "::group::publint $dir"
            (cd "$dir" && npx --yes publint)
            echo "::endgroup::"
            echo "::group::attw $dir"
            # We target Node >=20 (see `engines` at the root), so we
            # intentionally skip the node10 resolver — it pre-dates the
            # `exports` field and can't find subpath entries.
            (cd "$dir" && npx --yes -p @arethetypeswrong/cli attw --pack . --profile node16)
            echo "::endgroup::"
          done

      - name: npm publish
        env:
          PATHS: ${{ steps.resolve.outputs.paths }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Supports both secrets.NPM_TOKEN (traditional auth) and Trusted Publishing
        # via OIDC provenance on npmjs.com.
        run: |
          set -euo pipefail
          echo "$PATHS" | jq -r '.[]' | while read -r dir; do
            echo "::group::publish $dir"
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              (cd "$dir" && npm publish --access public)
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
            echo "::endgroup::"
          done

      - name: Create GitHub Release (tag push)
        # Manual tags (e.g. `v0.0.1`) bypass the release-please job, so no
        # GitHub Release would exist for them. Create one from the tag so
        # the Releases page reflects every published version.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
