name: GigaBoard FeelLab (nonvisual correctness)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: feel-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-correctness:
    name: Browser visual and interaction correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build workspace dependencies
        run: bun run turbo build
      - name: Install locked Playwright Chromium and WebKit
        working-directory: apps/benchmarks
        run: bun x playwright install --with-deps chromium webkit
      - name: Run automatic nonvisual FeelLab checks
        working-directory: apps/benchmarks
        run: bun run feel:ci
      - name: Assert real Playwright results exist
        run: |
          test -s apps/benchmarks/feel-results/results.json
          test -s apps/benchmarks/feel-results/report.md
          grep -q '"PASS"' apps/benchmarks/feel-results/results.json
      - name: Preserve accessible text reports on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gigaboard-feellab-report
          path: |
            apps/benchmarks/feel-results/
            apps/benchmarks/test-results/
          if-no-files-found: warn
          retention-days: 14

  macos-webkit-drag:
    name: macOS WebKit drag, pointer and sound semantics (NOT native WKWebView)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install locked workspace
        run: bun install --frozen-lockfile
      - name: Build production fixture
        run: bun run turbo build
      - name: Install Playwright WebKit on macOS
        working-directory: apps/benchmarks
        run: bun x playwright install webkit
      - name: Run cache A/B pointer travel, hover and drag probes on macOS WebKit
        working-directory: apps/benchmarks
        run: bun x playwright test --config ./playwright.feel.config.ts --project=webkit-feel --grep '@dragperf|@pointerperf|@sound-e2e'
      - name: Print accessible macOS pointer A/B comparison
        working-directory: apps/benchmarks
        run: node ./feel/summarize-pointer.mjs
      - name: Require machine-readable and accessible results
        run: |
          test -s apps/benchmarks/feel-results/results.json
          test -s apps/benchmarks/feel-results/report.md
          grep -q '"PASS"' apps/benchmarks/feel-results/results.json
      - name: Keep macOS browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gigaboard-macos-webkit-drag-pointer
          path: |
            apps/benchmarks/feel-results/
            apps/benchmarks/test-results/
          if-no-files-found: warn
          retention-days: 14
