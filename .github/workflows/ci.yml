name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run turbo lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build (for workspace type resolution)
        run: bun run turbo build
      - name: Typecheck
        run: bun run turbo typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: "22"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run turbo build
      - name: Test
        run: bun run turbo test
