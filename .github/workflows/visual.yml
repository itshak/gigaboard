name: Visual Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright visual diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        # Resolve the binary from the docs workspace; invoking bun x from the
        # root installs the latest CLI, mismatching the locked test runtime.
        working-directory: apps/docs
        run: bun x playwright install --with-deps
      - name: Build packages + docs
        run: bun run turbo build
      - name: Visual tests
        run: bun run turbo test:visual
      - name: Upload Playwright report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-results
          path: |
            apps/docs/playwright-report/
            apps/docs/test-results/
          if-no-files-found: warn
          retention-days: 14
