name: Size Limit

on:
  pull_request:
    branches: [main]

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: size-limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run turbo build
      - name: size-limit
        run: bun run turbo size
