name: Performance Regression

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly extended runs (heavier fuzz and matrices).
    - cron: "17 4 * * *"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run turbo build
      - name: Bench
        run: bun run turbo bench
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: apps/benchmarks/bench-results/
          retention-days: 90
