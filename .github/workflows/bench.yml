name: Performance Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Nightly extended runs (heavier fuzz and matrices).
    - cron: "17 4 * * *"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run turbo build
      - name: Bench
        run: bun run turbo bench
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: apps/benchmarks/bench-results/
          retention-days: 90

  browser:
    name: Playwright browser benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build workspace
        run: bun run turbo build
      - name: Install locked Chromium browser
        working-directory: apps/benchmarks
        run: bun x playwright install --with-deps chromium
      - name: Run head-to-head browser suite
        working-directory: apps/benchmarks
        run: bun run bench:playwright
      - name: Upload browser benchmark JSON and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-bench-results
          path: |
            apps/benchmarks/bench-results/
            apps/benchmarks/test-results/
          if-no-files-found: warn
          retention-days: 30
